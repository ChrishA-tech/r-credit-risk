name: ci
on: [push, pull_request]
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install R + packages (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-ggplot2 r-cran-dplyr r-cran-glmnet \
            r-cran-proc r-cran-mgcv r-cran-broom r-cran-scales
      - name: Run analysis
        run: Rscript analysis.R
      - name: Checks
        run: Rscript tests/test_analysis.R
